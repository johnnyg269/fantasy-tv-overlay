    <radialGradient id="corner" cx="0" cy="0" r="1" gradientTransform="scale(1040 680)" gradientUnits="userSpaceOnUse"><stop stop-color="#080d12" stop-opacity=".97"/><stop offset=".48" stop-color="#080d12" stop-opacity=".9"/><stop offset="1" stop-color="#080d12" stop-opacity="0"/></radialGradient>
    <linearGradient id="bottom" x2="1" y2="0"><stop stop-color="#111b23"/><stop offset="1" stop-color="#182830"/></linearGradient>
  </defs>
  <rect width="1280" height="720" rx="22" fill="url(#field)"/>
  <g transform="translate(540 70) rotate(-13)" fill="none" stroke="#dae4d6" opacity=".14">
